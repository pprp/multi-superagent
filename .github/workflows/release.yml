name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Pack
        run: |
          pnpm pack
          echo "TGZ=$(ls -1 dsh-multi-superagent-*.tgz | head -1)" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(printf '%s\n' "Automated release for \`${GITHUB_REF_NAME}\`." "" "- \`pnpm check\` passed" "- Artifact: \`${TGZ}\` (DSH plugin tarball)")"
          gh release create "$GITHUB_REF_NAME" "$TGZ" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes" \
            --verify-tag
